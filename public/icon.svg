<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Water Ripples / Filter System Rings -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="14" />
  <circle cx="256" cy="270" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" />

  <!-- Central Water Droplet with Filter Lines -->
  <g filter="url(#shadow)">
    <!-- Main Drop -->
    <path d="M256 120 C256 120, 160 250, 160 310 C160 363 203 406 256 406 C309 406 352 363 352 310 C352 250, 256 120, 256 120 Z" fill="url(#dropGrad)" />
    
    <!-- Stylized Filtration Waves inside the drop -->
    <path d="M200 295 Q228 310 256 295 T312 295" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <path d="M210 335 Q233 350 256 335 T302 335" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" />
    
    <!-- Droplet Highlight -->
    <path d="M205 240 C195 270 200 300 200 300 C190 290 185 270 195 240 C200 225 215 200 215 200 C215 200 212 220 205 240 Z" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
